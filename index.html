<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d542b" />

    <title>HouseBank — Real Estate & Property Investment Marketplace</title>
    <meta name="description" content="HouseBank is a real estate and property-investment marketplace — browse verified listings, buy, rent, or invest in property, and connect with realtors and companies, all in one place." />
    <meta name="robots" content="index, follow" />

    <!-- Static fallback Open Graph / Twitter Card tags for crawlers that don't
         execute JS (Facebook/WhatsApp/LinkedIn/Slack unfurl bots and similar).
         src/components/Seo.tsx overrides these per-page for everything else,
         including Google, which does render JS. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HouseBank" />
    <meta property="og:title" content="HouseBank — Real Estate & Property Investment Marketplace" />
    <meta property="og:description" content="HouseBank is a real estate and property-investment marketplace — browse verified listings, buy, rent, or invest in property, and connect with realtors and companies, all in one place." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HouseBank — Real Estate & Property Investment Marketplace" />
    <meta name="twitter:description" content="HouseBank is a real estate and property-investment marketplace — browse verified listings, buy, rent, or invest in property, and connect with realtors and companies, all in one place." />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
